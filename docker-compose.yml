# Local development stack: the three app roles + Postgres + Redis.
#   make dev        # build and start
#   make demo       # send 20 synthetic spectra
#   open http://localhost:8001   (results dashboard)
#
# Raw uploads are stored in Postgres locally (storage backend "db"); in EKS
# they go to S3. The credentials below are throwaway laptop defaults.

x-app: &app
  build: ./app
  image: labops:dev
  restart: unless-stopped
  environment:
    LABOPS_DATABASE_URL: postgresql://labops:labops@postgres:5432/labops
    LABOPS_QUEUE_BACKEND: redis
    LABOPS_REDIS_URL: redis://redis:6379/0
    LABOPS_STORAGE_BACKEND: db
    LABOPS_FAULT_MODE: ${LABOPS_FAULT_MODE:-}
  read_only: true
  tmpfs: [/tmp]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  ingest-api:
    <<: *app
    ports: ["8000:8000"]

  results-api:
    <<: *app
    command: ["uvicorn", "labops.results_api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8001:8000"]

  worker:
    <<: *app
    command: ["labops-worker"]
    ports: ["9100:9100"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: labops
      POSTGRES_PASSWORD: labops
      POSTGRES_DB: labops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labops"]
      interval: 5s
      retries: 10
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
