# Local cluster: 1 control plane + 2 workers, so the node-failure game day
# has somewhere to move pods to. Zones are faked with labels so the chart's
# topologySpreadConstraints behave like on EKS.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: labops
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
