{{- range $name, $c := .Values.components }}
{{- if $c.enabled }}
{{- $ctx := dict "root" $ "component" $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "labops.fullname" $ }}-{{ $name }}
  labels:
    {{- include "labops.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    {{- include "labops.selector" $ctx | nindent 4 }}
  ports:
    - name: {{ if eq $name "worker" }}metrics{{ else }}http{{ end }}
      port: {{ $c.port }}
      targetPort: {{ if eq $name "worker" }}metrics{{ else }}http{{ end }}
{{- end }}
{{- end }}
