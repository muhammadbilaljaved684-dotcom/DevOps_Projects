{{- if .Values.monitoring.serviceMonitor }}
{{- range $name, $c := .Values.components }}
{{- if $c.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "labops.fullname" $ }}-{{ $name }}
  labels:
    {{- include "labops.labels" $ | nindent 4 }}
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  endpoints:
    - port: {{ if eq $name "worker" }}metrics{{ else }}http{{ end }}
      path: {{ $c.metricsPath }}
      interval: 15s
{{- end }}
{{- end }}
{{- if .Values.postgres.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "labops.fullname" . }}-pg
  labels:
    {{- include "labops.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ include "labops.fullname" . }}-pg
  podMetricsEndpoints:
    - port: metrics
{{- end }}
{{- end }}
