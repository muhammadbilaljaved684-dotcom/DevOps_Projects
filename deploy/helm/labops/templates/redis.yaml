{{- if .Values.redis.enabled }}
{{- $ctx := dict "root" . "component" "redis" }}
# Single-replica Redis used only as a job queue. AOF persistence survives a
# container restart; losing the pod loses queued jobs, which the
# "stuck-in-queued" runbook covers. See docs/adr/0004.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "labops.fullname" . }}-redis
  labels:
    {{- include "labops.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "labops.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "labops.selector" $ctx | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--appendonly", "yes", "--dir", "/data", "--protected-mode", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: redis }
            periodSeconds: 15
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "labops.fullname" . }}-redis
  labels:
    {{- include "labops.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "labops.selector" $ctx | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
