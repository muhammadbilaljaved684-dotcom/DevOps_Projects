{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "labops.fullname" . }}
  labels:
    {{- include "labops.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentRef.name }}
      namespace: {{ .Values.gateway.parentRef.namespace }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path: { type: Exact, value: /api/v1/uploads }
          method: POST
      backendRefs:
        - name: {{ include "labops.fullname" . }}-ingest
          port: {{ .Values.components.ingest.port }}
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ include "labops.fullname" . }}-results
          port: {{ .Values.components.results.port }}
{{- end }}
