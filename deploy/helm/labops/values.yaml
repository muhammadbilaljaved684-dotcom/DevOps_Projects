# Default values. Environment overrides live in values-dev.yaml / values-prod.yaml
# and are applied by Argo CD (deploy/argocd/apps/*.yaml).

image:
  repository: ghcr.io/muhammadbilaljaved684-dotcom/labops
  # CI writes the immutable tag (git SHA) here via a pull request.
  tag: "0.1.0"
  # Optional: pin by digest; when set it takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

awsRegion: eu-central-1

serviceAccount:
  create: true
  # In EKS, the Terraform output `labops_irsa_role_arn` goes here so pods get
  # S3 access without any keys.
  annotations: {}

# Settings shared by all three roles (rendered into a ConfigMap).
config:
  logLevel: INFO
  queueBackend: redis
  storageBackend: db             # "db" = raw files in Postgres (local); "s3" in EKS
  s3Bucket: ""
  maxUploadBytes: "5242880"
  # Game-day switch. Must stay empty outside a drill; an alert fires if not.
  faultMode: ""
  faultDelaySeconds: "45"

# Where the DB URL comes from. With the bundled CloudNativePG cluster the
# operator creates "<release>-pg-app" with key "uri".
database:
  existingSecret: ""
  secretKey: uri

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

components:
  ingest:
    enabled: true
    replicas: 2
    command: ["uvicorn", "labops.ingest_api:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    port: 8000
    metricsPath: /metrics
    resources:
      requests: { cpu: 100m, memory: 160Mi }
      limits: { cpu: 500m, memory: 320Mi }
  results:
    enabled: true
    replicas: 2
    command: ["uvicorn", "labops.results_api:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    port: 8000
    metricsPath: /metrics
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 300m, memory: 256Mi }
  worker:
    enabled: true
    replicas: 2
    command: ["labops-worker"]
    port: 9100           # metrics only
    metricsPath: /metrics
    resources:
      requests: { cpu: 250m, memory: 256Mi }
      limits: { cpu: "1", memory: 512Mi }

autoscaling:
  worker:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Gateway API routing (Envoy Gateway in this platform; Ingress-NGINX is
# retired upstream). The shared Gateway is created by the platform layer.
gateway:
  enabled: false
  parentRef:
    name: labops-gateway
    namespace: envoy-gateway-system
  hostname: labops.local

networkPolicy:
  enabled: true
  # Namespace label selector for the ingress controller and Prometheus.
  ingressControllerNamespace: envoy-gateway-system
  monitoringNamespace: monitoring

# Bundled dependencies (simple, in-cluster). For a real company you would use
# ElastiCache/RDS; see docs/adr/0004-in-cluster-data-services.md.
redis:
  enabled: true
  image: redis:7.4-alpine
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }

postgres:
  enabled: true          # requires the CloudNativePG operator (platform app)
  instances: 2
  storageSize: 5Gi
  storageClass: ""
  backup:
    enabled: false       # set in prod: S3 bucket from Terraform
    destinationPath: ""
    roleArn: ""
    retentionPolicy: "14d"

monitoring:
  serviceMonitor: true   # requires kube-prometheus-stack CRDs
  prometheusRule: true
  grafanaDashboard: true
  slo:
    latencySeconds: 30   # "processed within 30 s"
    objective: 0.99      # for 99% of uploads
  queueBacklogThreshold: 100
