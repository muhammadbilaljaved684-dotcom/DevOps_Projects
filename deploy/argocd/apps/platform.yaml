# Cluster add-ons. Chart versions are pinned and kept current by Renovate
# (renovate.json). Versions were current in October 2026.
# Sync waves order the install: CRDs/operators first, then things that use them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.1.0
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        prometheus:
          prometheusSpec:
            retention: 15d
            # Pick up ServiceMonitors/Rules from every namespace.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
        grafana:
          sidecar:
            dashboards: { enabled: true, label: grafana_dashboard, searchNamespace: ALL }
          # SSO via Entra ID (docs/entra-sso.md). The secret is optional so the
          # stack still starts on a laptop; SSO switches on when it exists.
          envFromSecrets:
            - name: grafana-entra
              optional: true
          grafana.ini:
            server:
              root_url: https://grafana.labops.example.com
            auth.azuread:
              enabled: $__env{ENTRA_SSO_ENABLED}
              name: Microsoft Entra ID
              allow_sign_up: true
              client_id: $__env{ENTRA_CLIENT_ID}
              client_secret: $__env{ENTRA_CLIENT_SECRET}
              scopes: openid email profile
              auth_url: https://login.microsoftonline.com/$__env{ENTRA_TENANT_ID}/oauth2/v2.0/authorize
              token_url: https://login.microsoftonline.com/$__env{ENTRA_TENANT_ID}/oauth2/v2.0/token
              # Entra group object IDs -> Grafana roles (Terraform outputs).
              role_attribute_path: >-
                contains(groups[*], '$__env{ENTRA_ADMINS_GROUP}') && 'Admin' ||
                contains(groups[*], '$__env{ENTRA_DEVS_GROUP}') && 'Editor' || 'Viewer'
              role_attribute_strict: true
        alertmanager:
          config:
            route:
              receiver: default
              group_by: [alertname, namespace]
              routes:
                - matchers: ['severity="page"']
                  receiver: page
            receivers:
              - name: default
              - name: page   # wire to Teams/Slack/PagerDuty in your fork
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
---
