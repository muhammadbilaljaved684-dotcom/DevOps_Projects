# App of apps. Apply once after installing Argo CD:
#   kubectl apply -n argocd -f deploy/argocd/root.yaml
# From then on, everything in the cluster comes from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/muhammadbilaljaved684-dotcom/DevOps_Projects.git
    targetRevision: main
    path: deploy/argocd/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
