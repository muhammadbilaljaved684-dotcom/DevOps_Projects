# Everything that isn't app code or Terraform: Helm chart, Kubernetes
# manifests, Kyverno policies, Argo CD apps, Ansible. Broken YAML never
# reaches Argo CD because it never reaches main.
name: platform-checks

on:
  pull_request:
    paths: ["deploy/**", "ansible/**", ".github/workflows/platform-checks.yml"]
  push:
    branches: [main]
    paths: ["deploy/**", "ansible/**"]

permissions:
  contents: read

jobs:
  helm-and-manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Helm lint (all environments)
        run: |
          for env in dev prod; do
            helm lint deploy/helm/labops -f deploy/helm/labops/values.yaml -f deploy/helm/labops/values-$env.yaml --strict
          done
      - name: Render and validate against Kubernetes + CRD schemas
        run: |
          SCHEMAS='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for env in dev prod; do
            helm template labops deploy/helm/labops -n labops-$env \
              -f deploy/helm/labops/values.yaml -f deploy/helm/labops/values-$env.yaml \
              | kubeconform -strict -summary -kubernetes-version 1.34.0 \
                  -schema-location default -schema-location "$SCHEMAS"
          done
          kubeconform -strict -summary -schema-location default -schema-location "$SCHEMAS" \
            deploy/argocd/root.yaml deploy/argocd/apps deploy/argocd/apps-prod-only \
            deploy/platform
          # Kyverno policies are schema-checked by the Kyverno CLI in the next job.

  slo-alert-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Install promtool
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.7.3/prometheus-3.7.3.linux-amd64.tar.gz \
            | tar xz --strip-components=1 -C /usr/local/bin prometheus-3.7.3.linux-amd64/promtool
      - name: Render alert rules from the chart
        run: |
          helm template labops deploy/helm/labops -n labops-prod \
            -f deploy/helm/labops/values.yaml -f deploy/helm/labops/values-prod.yaml \
            | yq 'select(.kind == "PrometheusRule") | .spec' > deploy/monitoring/tests/rules.yaml
      - name: Check rules and run alert unit tests
        working-directory: deploy/monitoring/tests
        run: |
          promtool check rules rules.yaml
          promtool test rules slo-alerts.test.yaml

  kyverno-policies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: kyverno/action-install-cli@fcee92fca5c883169ef9927acf543e0b5fc58289 # v0.2.0
        with:
          release: v1.19.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Policy unit tests
        run: kyverno test deploy/policies/tests
      - name: Our own chart must pass our own policies
        run: |
          helm template labops deploy/helm/labops -n labops-prod \
            -f deploy/helm/labops/values.yaml -f deploy/helm/labops/values-prod.yaml \
            | yq 'select(.kind == "Deployment" or .kind == "StatefulSet")' > workloads.yaml
          kyverno apply deploy/policies/pod-security.yaml --resource workloads.yaml
          # Parse-check the image policy too (no network verification here:
          # the chart's image reference is a placeholder until CI publishes).
          kyverno apply deploy/policies/verify-images.yaml --resource deploy/policies/tests/resources.yaml

  ansible:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ansible-core ansible-lint
      - run: ansible-galaxy collection install -r requirements.yml
      - name: Syntax check
        run: |
          for pb in playbooks/*.yml; do ansible-playbook --syntax-check "$pb"; done
      - name: ansible-lint (production profile)
        run: ansible-lint --profile production playbooks roles

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: shellcheck scripts/*.sh chaos/*.sh
