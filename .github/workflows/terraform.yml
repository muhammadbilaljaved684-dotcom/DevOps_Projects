# Infrastructure pipeline.
#   PR   : fmt, validate, tflint, Checkov policy scan, then `terraform plan`
#          with a READ-ONLY role; the plan is posted on the PR for review.
#   main : `terraform apply` with the apply role, only after a human approves
#          the "prod" GitHub Environment (Settings > Environments > reviewers).
# No AWS keys exist in the repo: both roles are assumed via GitHub OIDC.
name: terraform

on:
  pull_request:
    paths: ["infra/terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infra/terraform/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-aws   # never two plans/applies against the same state at once
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: eu-central-1
  TF_VAR_github_owner: ${{ github.repository_owner }}
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
  TF_VAR_owner: ${{ vars.OWNER_EMAIL }}
  TF_VAR_budget_email: ${{ vars.OWNER_EMAIL }}
  TF_VAR_kubernetes_version: ${{ vars.EKS_VERSION }}
  TF_VAR_api_allowed_cidrs: ${{ vars.API_ALLOWED_CIDRS }}         # e.g. ["203.0.113.10/32"]
  TF_VAR_admin_principal_arns: ${{ vars.ADMIN_PRINCIPAL_ARNS }}   # e.g. ["arn:aws:iam::...:user/you"]

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
      - name: Format
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate every root module
        run: |
          for dir in infra/terraform/bootstrap infra/terraform/envs/aws infra/terraform/envs/entra; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - name: TFLint
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/infra/terraform/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/infra/terraform/.tflint.hcl" --chdir infra/terraform
      - name: Checkov (security/compliance policies for IaC)
        uses: bridgecrewio/checkov-action@c13aafd679d3814a25067d10fcaf98c4f7594931 # v12.3131.0
        with:
          directory: infra/terraform
          framework: terraform
          config_file: infra/terraform/.checkov.yaml

  plan:
    needs: static
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    defaults:
      run:
        working-directory: infra/terraform/envs/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - id: plan
        run: terraform plan -lock-timeout=5m -no-color -out=tfplan
      - name: Post plan on the PR
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Terraform plan (envs/aws)"
            echo '<details><summary>Show plan</summary>'
            echo
            echo '```'
            echo "${PLAN}" | tail -c 60000
            echo '```'
            echo '</details>'
          } > plan.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file plan.md

  apply:
    needs: static
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: prod        # requires reviewer approval before this job starts
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/envs/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform apply -lock-timeout=5m -auto-approve
