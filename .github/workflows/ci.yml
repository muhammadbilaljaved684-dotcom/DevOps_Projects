# App pipeline: test -> build -> scan (blocking) -> SBOM -> sign -> deploy to dev.
#
# Supply-chain choices worth asking me about in an interview:
#   * every action is pinned to a commit SHA (tags can be moved by attackers)
#   * no registry or cloud secrets: GHCR uses GITHUB_TOKEN, signing is keyless
#     (Sigstore + GitHub OIDC), AWS is never touched from here
#   * the scan gate fails the build on fixable HIGH/CRITICAL CVEs
#   * Kyverno in the cluster refuses images not signed by THIS workflow on main
name: ci

on:
  pull_request:
    paths: ["app/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/ci.yml"]
  workflow_dispatch: {}   # "Run workflow" button; on main it publishes like a push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/labops

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit + integration tests (coverage gate 80%)
        run: pytest --junitxml=junit.xml

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write          # keyless signing
      security-events: write   # upload scan results to the Security tab
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once, load locally for scanning; push only after the scan passes.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vulnerability scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Vulnerability report for the Security tab
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          format: sarif
          output: trivy.sarif
          skip-setup-trivy: true

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: trivy.sarif

      - name: Push
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha

      - name: SBOM (SPDX)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'

      - name: Sign image and attest SBOM (keyless)
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

  deploy-dev:
    # GitOps: CI never talks to the cluster. It changes Git; Argo CD does the rest.
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point dev at the new image
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          sed -i -E "s|^(  tag: ).*|\1\"${TAG}\"|" deploy/helm/labops/values-dev.yaml
          git config user.name  "labops-ci"
          git config user.email "labops-ci@users.noreply.github.com"
          git commit -am "deploy(dev): ${TAG}"
          git push
