# Local practice target: the Ubuntu VM from ansible/Vagrantfile.
# The VM runs in VirtualBox on Windows (started with `vagrant up` from
# PowerShell); Ansible runs in WSL. See the build guide, Level 7.
all:
  children:
    lab_edge:
      hosts:
        edge-01:
          ansible_host: 192.168.56.20
          ansible_user: vagrant
          # Copied from the Windows folder's .vagrant/machines/edge-01/virtualbox/private_key
          # (WSL refuses keys on /mnt/c because of their permissions).
          ansible_ssh_private_key_file: ~/.ssh/labops-edge-vagrant.key
          # Lab only: keep the vagrant login allowed after hardening, so Ansible
          # can still connect for the AFTER scan. Real hosts allow only named admins.
          ssh_allow_users: "bilal vagrant"
          # The Windows host on VirtualBox's host-only network (kind port-forward).
          labops_uploader_ingest_url: "http://192.168.56.1:8000"
