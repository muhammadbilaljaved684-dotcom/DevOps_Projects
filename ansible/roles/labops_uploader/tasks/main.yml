# The lab-edge job: instruments drop CSV spectra into an outbox folder; a
# systemd path unit notices and the uploader ships them to the ingest API.
# Failed files are kept for retry, never deleted.

- name: Service user (no shell, no home login)
  ansible.builtin.user:
    name: labops
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/labops
    create_home: true

- name: Spool directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: labops
    group: labops
    mode: "0770"
  loop:
    - "{{ labops_uploader_outbox }}"
    - "{{ labops_uploader_outbox }}/../sent"
    - "{{ labops_uploader_outbox }}/../failed"

- name: Uploader script
  ansible.builtin.template:
    src: labops-upload.sh.j2
    dest: /usr/local/bin/labops-upload
    mode: "0755"

- name: Install systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - labops-uploader.service
    - labops-uploader.path
    - labops-retry.service
    - labops-retry.timer
  notify: Reload systemd

- name: Flush handlers so systemd knows the new units
  ansible.builtin.meta: flush_handlers

- name: Enable path watcher and retry timer
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop: [labops-uploader.path, labops-retry.timer]
